name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip

      - name: Build
        run: ./gradle-4.9/bin/gradle setupCiWorkspace build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: rustinventory-jar
          path: build/libs/*.jar
